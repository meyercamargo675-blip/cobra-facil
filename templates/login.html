<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobroBot - Iniciar Sesión</title>

    <!-- Código oficial de Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1187486544491239"
         crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Navbar sencillo público -->
    <nav class="bg-indigo-700 text-white shadow-lg p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-extrabold tracking-wide">🤖 CobroBot</span>
            <a href="/register" class="bg-indigo-600 hover:bg-indigo-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition">
                Registrarse
            </a>
        </div>
    </nav>

    <!-- Contenido del Login -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-200/80 w-full max-w-md space-y-5">
            <div class="text-center">
                <span class="text-4xl">🤖</span>
                <h1 class="text-2xl font-black text-gray-800 mt-2">CobroBot Login</h1>
                <p class="text-xs text-gray-500 mt-1">Ingresa tus credenciales para acceder a tu panel</p>
            </div>

            {% if mensaje_alerta %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded-r-lg text-xs font-medium">
                {{ mensaje_alerta }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Usuario</label>
                    <input type="text" name="usuario" required placeholder="Tu usuario" class="w-full border border-gray-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="text-center border-t pt-4">
                <p class="text-xs text-gray-600">
                    ¿No tienes una cuenta? 
                    <a href="/register" class="text-indigo-600 font-bold hover:underline">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer obligatorio con enlaces legales -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 font-medium space-x-4">
        <span>CobroBot SaaS &copy; 2026 - Todos los derechos reservados.</span>
        <a href="/terminos" target="_blank" class="text-indigo-600 hover:underline">Términos y Condiciones</a>
        <span>•</span>
        <a href="/privacidad" target="_blank" class="text-indigo-600 hover:underline">Política de Privacidad</a>
    </footer>

</body>
</html>
