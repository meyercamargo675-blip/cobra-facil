<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobroBot - Iniciar Sesión</title>

    <!-- Código de AdSense requerido para la verificación -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1187486544491239"
         crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Contenido del Login (Tu formulario actual) -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🤖 CobroBot Login</h1>
            
            <!-- Aquí va tu formulario de inicio de sesión -->
            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Usuario</label>
                    <input type="text" name="usuario" required class="w-full border border-gray-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                    <input type="password" name="password" required class="w-full border border-gray-300 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-sm">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- Footer obligatorio con enlaces legales públicos -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 font-medium space-x-4">
        <span>CobroBot SaaS &copy; 2026 - Todos los derechos reservados.</span>
        <a href="/terminos" target="_blank" class="text-indigo-600 hover:underline">Términos y Condiciones</a>
        <span>•</span>
        <a href="/privacidad" target="_blank" class="text-indigo-600 hover:underline">Política de Privacidad</a>
    </footer>

</body>
</html>
